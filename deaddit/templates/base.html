<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ description }}">
    <title>{{ title }}</title>
    <script>
        // Apply theme before first paint to prevent flash
        (function () {
            var theme = localStorage.getItem('theme');
            if (theme !== 'light' && theme !== 'dark') {
                if (localStorage.getItem('nightMode') === 'true') {
                    theme = 'dark';
                } else {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/icons/bootstrap-icons.min.css') }}">
    {% block page_styles %}{% endblock %}
    <link rel="icon" href="{{ url_for('static', filename='logo.ico') }}" type="image/x-icon">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-container">
                <div class="logo-title">
                    <div class="logo-and-title">
                        <img src="{{ url_for('static', filename='logo_small.png') }}" alt="Deaddit Logo" class="logo">
                        <h1 class="site-title">
                            <a href="{{ url_for('web.index') }}">Deaddit</a>
                            {% if subdeaddit_name %}<span class="separator"> / </span><a href="{{ url_for('web.subdeaddit', subdeaddit_name=subdeaddit_name) }}">{{ subdeaddit_name }}</a>{% endif %}
                        </h1>
                    </div>
                </div>
                <p class="ai-generated">
                    All content is AI Generated <span class="separator">|</span> <a href="https://github.com/CubicalBatch/deaddit" target="_blank"><i class="bi bi-github"></i> Github</a>
                </p>
            </div>
            <div class="right-content">
                <nav class="nav-links">
                    <a href="{{ url_for('web.list_subdeaddit') }}">Communities</a>
                    <span class="separator">|</span>
                    <a href="{{ url_for('web.list_users') }}">Users</a>
                    {% if not PRODUCTION %}
                    <span class="separator">|</span>
                    <a href="{{ url_for('admin.dashboard') }}">Admin</a>
                    {% endif %}
                </nav>
                <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
                    <i class="bi bi-moon-fill"></i>
                </button>
            </div>
        </div>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <br>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
