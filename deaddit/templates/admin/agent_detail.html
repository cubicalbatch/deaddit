{% extends "admin/base.html" %}

{% block title %}Agent #{{ agent_id }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">
        Agent: <span id="agent-username">#{{ agent_id }}</span>
        <span id="agent-status-chip" class="badge bg-secondary ms-2" style="display: none;"></span>
    </h1>
    <div class="btn-toolbar">
        <button id="toggle-btn" class="btn btn-sm btn-outline-success me-2" disabled></button>
        <button id="force-run-btn" class="btn btn-sm btn-outline-primary" disabled
                title="Runs one visit synchronously (may take a few minutes)">
            <i class="bi bi-lightning"></i> Force Run
        </button>
        <a href="{{ url_for('admin.agents_dashboard') }}" class="btn btn-sm btn-outline-secondary ms-2">All Agents</a>
    </div>
</div>

<!-- Agent overview -->
<div class="row mb-4">
    <div class="col-lg-6">
        <div class="card h-100">
            <div class="card-header"><strong>Overview</strong></div>
            <div class="card-body">
                <dl class="row mb-0" id="overview-dl">
                    <dt class="col-sm-5">Loading…</dt><dd class="col-sm-7"></dd>
                </dl>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>Edit Agent Configuration</strong>
                <button type="button" id="reset-status-btn" class="btn btn-sm btn-outline-warning" style="display: none;" title="Clear failure strikes and re-arm agent">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset Errors / Re-arm
                </button>
            </div>
            <div class="card-body">
                <form id="edit-agent-form">
                    <div class="row g-2 mb-2">
                        <div class="col-md-6">
                            <label for="edit-tier-select" class="form-label small mb-1 fw-bold">Autonomy Tier</label>
                            <select id="edit-tier-select" class="form-select form-select-sm">
                                <option value="lurker">lurker</option>
                                <option value="regular">regular</option>
                                <option value="power_user">power_user</option>
                            </select>
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <div class="form-check form-switch mb-1">
                                <input class="form-check-input" type="checkbox" id="edit-enabled-switch" role="switch">
                                <label class="form-check-label small fw-bold" for="edit-enabled-switch">Agent Enabled</label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-md-6">
                            <label for="edit-provider-select" class="form-label small mb-1 fw-bold">LLM Provider</label>
                            <select id="edit-provider-select" class="form-select form-select-sm">
                                <option value="">Loading providers…</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="edit-model" class="form-label small mb-1 fw-bold">Model</label>
                            <div class="input-group input-group-sm">
                                <input type="text" id="edit-model" class="form-control form-control-sm" list="edit-model-options" placeholder="(default model)">
                                <datalist id="edit-model-options"></datalist>
                                <button type="button" id="edit-refresh-models-btn" class="btn btn-outline-secondary btn-sm" title="Refresh models from provider">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label small mb-1 d-block fw-bold">Cadence (Delay in seconds)</label>
                        <div id="edit-cadence-presets" class="btn-group btn-group-sm mb-1 w-100" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" data-min="1800" data-max="7200">slow (1800/7200)</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" data-min="900" data-max="3600">normal (900/3600)</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" data-min="300" data-max="1500">active (300/1500)</button>
                        </div>
                        <div class="d-flex gap-2">
                            <div class="flex-fill">
                                <input type="number" id="edit-min-delay" class="form-control form-control-sm" min="0" placeholder="Min delay (s)">
                            </div>
                            <div class="flex-fill">
                                <input type="number" id="edit-max-delay" class="form-control form-control-sm" min="0" placeholder="Max delay (s)">
                            </div>
                        </div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-md-4">
                            <label for="edit-ceiling" class="form-label small mb-1 fw-bold">Daily Ceiling</label>
                            <input type="number" id="edit-ceiling" class="form-control form-control-sm" min="1" placeholder="(unlimited)">
                        </div>
                        <div class="col-md-4">
                            <label for="edit-max-actions" class="form-label small mb-1 fw-bold">Max Actions / Run</label>
                            <input type="number" id="edit-max-actions" class="form-control form-control-sm" min="1" placeholder="30">
                        </div>
                        <div class="col-md-4">
                            <label for="edit-max-seconds" class="form-label small mb-1 fw-bold">Max Run Secs</label>
                            <input type="number" id="edit-max-seconds" class="form-control form-control-sm" min="1" placeholder="300">
                        </div>
                    </div>

                    <hr>
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="edit-image-enabled-switch" role="switch">
                        <label class="form-check-label small fw-bold" for="edit-image-enabled-switch">Image Posts Enabled (requires a non-lurker tier)</label>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-md-4">
                            <label for="edit-image-provider-select" class="form-label small mb-1 fw-bold">Image Provider</label>
                            <select id="edit-image-provider-select" class="form-select form-select-sm">
                                <option value="">Loading image providers…</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="edit-image-model" class="form-label small mb-1 fw-bold">Model Override</label>
                            <input type="text" id="edit-image-model" class="form-control form-control-sm" list="edit-image-model-options" placeholder="(provider default)">
                            <datalist id="edit-image-model-options"></datalist>
                            <div id="edit-image-model-hint" class="form-text"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="edit-image-policy-select" class="form-label small mb-1 fw-bold">Image Policy</label>
                            <select id="edit-image-policy-select" class="form-select form-select-sm">
                                <option value="optional">optional</option>
                                <option value="image_only">image_only</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex align-items-center gap-2 mt-3">
                        <button type="submit" id="save-agent-btn" class="btn btn-primary btn-sm">
                            <i class="bi bi-check-lg"></i> Save Changes
                        </button>
                        <span id="edit-feedback" class="small"></span>
                    </div>
                </form>

                <div class="accordion accordion-flush mt-3" id="rawConfigAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="headingRaw">
                            <button class="accordion-button collapsed py-1 px-0 small text-muted" type="button" data-bs-toggle="collapse" data-bs-target="#collapseRaw" aria-expanded="false" aria-controls="collapseRaw">
                                View Raw State &amp; Config JSON
                            </button>
                        </h2>
                        <div id="collapseRaw" class="accordion-collapse collapse" aria-labelledby="headingRaw">
                            <div class="accordion-body px-0 pt-2 pb-0">
                                <h6>config</h6>
                                <pre id="config-pre" class="thought-pre p-2 rounded small mb-2">loading…</pre>
                                <h6>state</h6>
                                <pre id="state-pre" class="thought-pre p-2 rounded small mb-0">loading…</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Run timeline -->
<div class="card">
    <div class="card-header"><strong>Run Timeline</strong></div>
    <div class="card-body p-2">
        <div id="runs-list" class="list-group list-group-flush"></div>
        <div class="p-2 border-top">
            <button type="button" id="older-runs-btn"
                    class="btn btn-sm btn-outline-secondary w-100"
                    style="display: none;">Older runs</button>
            <p id="runs-error" class="text-danger small mb-0 mt-1"
               role="alert" style="display: none;"></p>
        </div>
    </div>
</div>

<!-- Thought drill-down modal-ish panel -->
<div id="turns-panel" class="card mt-4" style="display: none;">
    <div class="card-header d-flex justify-content-between align-items-center">
        <strong id="turns-title">Turns</strong>
        <button id="turns-close" class="btn btn-sm btn-outline-secondary" type="button">Close</button>
    </div>
    <div class="card-body p-2">
        <div id="turns-list" class="list-group list-group-flush"></div>
        <div id="turn-detail" class="p-2"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
    "use strict";

    const AGENT_ID = {{ agent_id | tojson }};
    const STATUS_BADGE = {
        idle: "bg-success",
        running: "bg-primary",
        failed: "bg-danger",
        interrupted: "bg-secondary",
    };

    function esc(value) {
        return String(value == null ? "" : value);
    }

    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = esc(text);
        return node;
    }

    function fmtDate(iso) {
        return iso ? iso.replace("T", " ").slice(0, 19) : "-";
    }

    // token_usage.total_tokens preferred, prompt+completion fallback, else null.
    function runTokens(run) {
        const usage = run && run.token_usage;
        if (!usage || typeof usage !== "object") return null;
        if (usage.total_tokens != null) return usage.total_tokens;
        if (usage.total != null) return usage.total;
        const prompt = usage.prompt_tokens != null ? usage.prompt_tokens : usage.prompt;
        const completion = usage.completion_tokens != null
            ? usage.completion_tokens : usage.completion;
        if (prompt != null && completion != null) return prompt + completion;
        if (prompt != null) return prompt;
        if (completion != null) return completion;
        return null;
    }

    async function api(path, options) {
        const response = await fetch(path, Object.assign({headers: {"Content-Type": "application/json"}}, options || {}));
        let data = {};
        try { data = await response.json(); } catch (err) { /* non-JSON body */ }
        if (!response.ok) {
            throw new Error(data.error || data.message || ("HTTP " + response.status));
        }
        return data;
    }

    let agent = null;

    async function loadAgent() {
        try {
            agent = await api("/admin/api/agents/" + AGENT_ID);
        } catch (err) {
            agent = null;
        }
        const chip = document.getElementById("agent-status-chip");
        const toggleBtn = document.getElementById("toggle-btn");
        const runBtn = document.getElementById("force-run-btn");
        const resetBtn = document.getElementById("reset-status-btn");
        const saveBtn = document.getElementById("save-agent-btn");

        if (!agent) {
            chip.style.display = "";
            chip.className = "badge bg-dark ms-2";
            chip.textContent = "no agent registered";
            toggleBtn.disabled = true;
            runBtn.disabled = true;
            if (saveBtn) saveBtn.disabled = true;
            if (resetBtn) resetBtn.style.display = "none";
            document.getElementById("overview-dl").innerHTML = "";
            document.getElementById("overview-dl")
                .appendChild(el("dt", "col-sm-5", "Error"));
            document.getElementById("overview-dl")
                .appendChild(el("dd", "col-sm-7", "No agent registered for agent #" + AGENT_ID));
            document.getElementById("runs-list").innerHTML = "";
            return;
        }
        document.getElementById("agent-username").textContent =
            agent.display_label || agent.user_username;
        chip.style.display = "";
        chip.className = "badge ms-2 " + (STATUS_BADGE[agent.status] || "bg-dark");
        chip.textContent = agent.status;
        toggleBtn.disabled = false;
        toggleBtn.className = "btn btn-sm me-2 " + (agent.is_enabled ? "btn-outline-warning" : "btn-outline-success");
        toggleBtn.textContent = agent.is_enabled ? "Disable" : "Enable";
        runBtn.disabled = agent.status === "running";
        if (saveBtn) saveBtn.disabled = false;

        if (agent.consecutive_failures > 0 || agent.status === "failed" || agent.status === "interrupted") {
            resetBtn.style.display = "";
        } else {
            resetBtn.style.display = "none";
        }

        const dl = document.getElementById("overview-dl");
        dl.innerHTML = "";
        const rows = [
            ["Persona", agent.user_username],
            ["Tier", agent.autonomy_tier],
            ["Enabled", agent.is_enabled ? "yes" : "no"],
            ["Consecutive failures", String(agent.consecutive_failures)],
            ["Last run", fmtDate(agent.last_run_at)],
            ["Next run", fmtDate(agent.next_run_at)],
            ["Runs completed", String(agent.runs_completed)],
            ["Runs failed", String(agent.runs_failed)],
            ["Runs interrupted", String(agent.runs_interrupted)],
            ["Total runs", String(agent.runs_total)],
        ];
        rows.forEach(([label, value]) => {
            dl.appendChild(el("dt", "col-sm-5", label));
            dl.appendChild(el("dd", "col-sm-7", value));
        });

        // Pre-populate edit form fields
        document.getElementById("edit-tier-select").value = agent.autonomy_tier || "regular";
        document.getElementById("edit-enabled-switch").checked = Boolean(agent.is_enabled);
        syncProviderSelection();
        document.getElementById("edit-model").value = (agent.config && agent.config.model) || "";
        document.getElementById("edit-min-delay").value = (agent.config && agent.config.min_delay != null) ? agent.config.min_delay : 60;
        document.getElementById("edit-max-delay").value = (agent.config && agent.config.max_delay != null) ? agent.config.max_delay : 900;
        document.getElementById("edit-ceiling").value = (agent.config && agent.config.daily_request_ceiling != null) ? agent.config.daily_request_ceiling : "";
        document.getElementById("edit-max-actions").value = (agent.config && agent.config.max_actions_per_run != null) ? agent.config.max_actions_per_run : 30;
        document.getElementById("edit-max-seconds").value = (agent.config && agent.config.max_run_seconds != null) ? agent.config.max_run_seconds : 300;

        const imgCfg = (agent.config && agent.config.image_posts) || {};
        document.getElementById("edit-image-enabled-switch").checked = Boolean(imgCfg.enabled);
        document.getElementById("edit-image-model").value = imgCfg.model || "";
        document.getElementById("edit-image-policy-select").value = imgCfg.policy || "optional";
        syncImageProviderSelection();

        document.getElementById("config-pre").textContent = JSON.stringify(agent.config, null, 2);
        document.getElementById("state-pre").textContent = JSON.stringify(agent.state, null, 2);
    }

    const RUN_BADGE = { running: "bg-primary", completed: "bg-success", failed: "bg-danger", interrupted: "bg-secondary" };
    let nextBeforeId = null;
    let expandedBtn = null;
    let currentRun = null;

    function runsUrl(before) {
        let url = "/admin/api/agents/" + agent.id + "/runs?limit=25";
        if (before != null) url += "&before_id=" + before;
        return url;
    }

    function updateOlderControl() {
        const btn = document.getElementById("older-runs-btn");
        btn.style.display = nextBeforeId != null ? "" : "none";
    }

    function showRunsError(message) {
        const err = document.getElementById("runs-error");
        if (message == null) {
            err.style.display = "none";
            return;
        }
        err.textContent = message;
        err.style.display = "";
    }

    function runItem(run) {
        const item = el("button",
            "list-group-item list-group-item-action text-start w-100 flex-column align-items-start");
        item.type = "button";
        item.setAttribute("aria-expanded", "false");
        const head = el("div", "d-flex w-100 justify-content-between");
        const left = el("div");
        left.appendChild(el("strong", null, "#" + run.id));
        left.appendChild(el("span", "ms-2 text-muted small", run.trigger));
        left.appendChild(document.createTextNode(" "));
        left.appendChild(el("span", "badge ms-2 " + (RUN_BADGE[run.status] || "bg-dark"), run.status));
        head.appendChild(left);
        head.appendChild(el("small", "text-muted",
            fmtDate(run.started_at) + " → " + fmtDate(run.finished_at)));
        item.appendChild(head);
        item.appendChild(el("div", "small text-muted mt-1",
            "turns " + (run.turn_count ?? 0) + " · actions " + (run.action_count ?? 0) +
            " · tokens " + (runTokens(run) ?? 0)));
        if (run.error_message) {
            item.appendChild(el("div", "small text-danger mt-1", run.error_message));
        }
        item.addEventListener("click", () => {
            Array.from(item.parentElement.querySelectorAll(".list-group-item"))
                .forEach((node) => node.classList.remove("active"));
            item.classList.add("active");
            setExpanded(item);
            openRun(run);
        });
        return item;
    }

    // aria-expanded tracks the one expandable entry currently open.
    function setExpanded(btn) {
        if (expandedBtn && expandedBtn !== btn) {
            expandedBtn.setAttribute("aria-expanded", "false");
        }
        if (btn) {
            btn.setAttribute("aria-expanded", "true");
        }
        expandedBtn = btn || null;
    }

    async function loadRuns() {
        if (!agent) return;
        const list = document.getElementById("runs-list");
        list.innerHTML = "";
        nextBeforeId = null;
        updateOlderControl();
        showRunsError(null);
        expandedBtn = null;
        currentRun = null;
        let data;
        try {
            data = await api(runsUrl());
        } catch (err) {
            list.appendChild(el("div", "text-danger p-2", "Failed to load runs: " + err.message));
            return;
        }
        if (!data.runs.length) {
            list.appendChild(el("div", "text-muted p-2", "No runs yet."));
            return;
        }
        data.runs.forEach((run) => list.appendChild(runItem(run)));
        nextBeforeId = data.next_before_id;
        updateOlderControl();
    }

    async function loadOlderRuns() {
        if (!agent || nextBeforeId == null) return;
        const btn = document.getElementById("older-runs-btn");
        btn.disabled = true;
        showRunsError(null);
        try {
            const data = await api(runsUrl(nextBeforeId));
            const list = document.getElementById("runs-list");
            data.runs.forEach((run) => list.appendChild(runItem(run)));
            nextBeforeId = data.next_before_id;
            updateOlderControl();
        } catch (err) {
            showRunsError("Couldn't load older runs: " + err.message);
        } finally {
            btn.disabled = false;
        }
    }

    function messageBlock(message) {
        const wrap = el("div", "border rounded p-2 mb-2");
        const role = (message && message.role) || "?";
        wrap.appendChild(el("div", "badge bg-info mb-1", role));
        const content = message && message.content !== undefined ? message.content : message;
        const pre = el("pre", "thought-pre p-2 rounded small mb-0");
        pre.style.whiteSpace = "pre-wrap";
        pre.textContent = typeof content === "string" ? content : JSON.stringify(content, null, 2);
        wrap.appendChild(pre);
        return wrap;
    }

    function contentCard(content) {
        const icon = content.kind === "comment" ? "bi-chat" : "bi-file-post";
        if (!content.href) {
            // Removed content: plain text, no link.
            const plain = el("div", "small text-muted d-flex align-items-center gap-1 mb-1");
            plain.appendChild(el("i", "bi " + icon));
            plain.appendChild(document.createTextNode(content.label || "(removed)"));
            return plain;
        }
        const link = document.createElement("a");
        link.className = "small d-flex align-items-center gap-1 mb-1";
        link.href = content.href;
        link.target = "_blank";
        link.rel = "noopener";
        link.appendChild(el("i", "bi " + icon));
        link.appendChild(document.createTextNode(content.label));
        return link;
    }

    function toolCallBlock(call) {
        const wrap = el("div", "border rounded p-2 mb-2");
        const head = el("div", "d-flex align-items-center gap-2 mb-1");
        head.appendChild(el("strong", null, call.name));
        head.appendChild(el("span", "badge " + (call.ok ? "bg-success" : "bg-danger"),
            call.ok ? "ok" : "failed"));
        if (call.duration_ms != null) {
            head.appendChild(el("span", "text-muted small", call.duration_ms + " ms"));
        }
        wrap.appendChild(head);
        if (call.content) {
            wrap.appendChild(contentCard(call.content));
        }
        const args = el("pre", "thought-pre p-2 rounded small mb-1");
        args.textContent = JSON.stringify(call.arguments, null, 2);
        wrap.appendChild(el("div", "small text-muted", "arguments:"));
        wrap.appendChild(args);
        const result = el("pre", "thought-pre p-2 rounded small mb-0");
        result.textContent = call.ok
            ? JSON.stringify(call.result, null, 2)
            : String(call.error || "");
        wrap.appendChild(el("div", "small text-muted", call.ok ? "result:" : "error:"));
        wrap.appendChild(result);
        return wrap;
    }

    function turnItem(turn) {
        const item = el("button",
            "list-group-item list-group-item-action text-start w-100");
        item.type = "button";
        item.setAttribute("aria-expanded", "false");
        const head = el("div", "d-flex w-100 justify-content-between");
        const left = el("div");
        left.appendChild(el("strong", null, "turn " + turn.seq));
        left.appendChild(el("span", "ms-2 text-muted small", turn.model || "—"));
        head.appendChild(left);
        head.appendChild(el("small", "text-muted",
            turn.latency_ms != null ? turn.latency_ms + " ms" : "—"));
        item.appendChild(head);
        let responseSummary = "";
        try {
            responseSummary = typeof turn.response_message.content === "string"
                ? turn.response_message.content.slice(0, 120)
                : JSON.stringify(turn.response_message).slice(0, 120);
        } catch (err) { /* leave summary empty */ }
        item.appendChild(el("div", "small text-truncate text-muted mt-1", responseSummary));
        item.addEventListener("click", () => {
            openTurn(turn, item);
        });
        return item;
    }

    async function openTurn(turn, itemNode) {
        const list = document.getElementById("turns-list");
        Array.from(list.querySelectorAll(".list-group-item")).forEach((node) => {
            node.classList.remove("active");
        });
        itemNode.classList.add("active");
        setExpanded(itemNode);

        // Full prompt chain for this turn.
        document.getElementById("turn-detail").replaceChildren();
        const detail = document.getElementById("turn-detail");

        // Null-safe turn metadata: em dash when the field never landed.
        const meta = el("dl", "row row-cols-sm-3 small text-muted border rounded p-2 mb-2 thought-pre");
        [
            ["Model", turn.model || "—"],
            ["Latency", turn.latency_ms != null ? turn.latency_ms + " ms" : "—"],
            ["Tokens (run)", String(runTokens(currentRun) ?? "—")],
        ].forEach(([label, value]) => {
            const wrapCol = el("div", "col-sm-4 mb-0");
            wrapCol.appendChild(el("dt", "col-sm-5", label));
            wrapCol.appendChild(el("dd", "col-sm-7 mb-0", value));
            meta.appendChild(wrapCol);
        });
        detail.appendChild(meta);

        detail.appendChild(el("h6", "mt-3 mb-2", "Request messages (verbatim)"));
        (turn.request_messages || []).forEach((message) => {
            detail.appendChild(messageBlock(message));
        });
        detail.appendChild(el("h6", "mt-3 mb-2", "Response message (verbatim)"));
        detail.appendChild(messageBlock(turn.response_message));

        detail.appendChild(el("h6", "mt-3 mb-2", "Tool calls"));
        const callsWrap = el("div");
        detail.appendChild(callsWrap);
        try {
            const data = await api("/admin/api/turns/" + turn.id + "/tool_calls");
            if (!data.tool_calls.length) {
                callsWrap.appendChild(el("div", "text-muted small", "No tool calls in this turn."));
            }
            data.tool_calls.forEach((call) => {
                callsWrap.appendChild(toolCallBlock(call));
            });
        } catch (err) {
            callsWrap.appendChild(el("div", "text-danger small", "Failed to load tool calls: " + err.message));
        }
    }

    async function openRun(run) {
        currentRun = run || null;
        const panel = document.getElementById("turns-panel");
        const title = document.getElementById("turns-title");
        title.textContent = "Run #" + run.id + " — loading turns…";
        panel.style.display = "";
        try {
            const data = await api("/admin/api/runs/" + run.id + "/turns");
            title.textContent = "Run #" + run.id + " — " + data.turns.length + " turn(s)";
            const list = document.getElementById("turns-list");
            list.replaceChildren();
            document.getElementById("turn-detail").replaceChildren();
            if (!data.turns.length) {
                list.appendChild(el("div", "text-muted p-2", "No LLM turns recorded."));
                return;
            }
            data.turns.forEach((turn) => {
                list.appendChild(turnItem(turn));
            });
        } catch (err) {
            title.textContent = "Run #" + run.id;
            const list = document.getElementById("turns-list");
            list.replaceChildren();
            list.appendChild(el("div", "text-danger p-2", "Failed to load turns: " + err.message));
        }
    }

    document.getElementById("older-runs-btn").addEventListener("click", () => {
        loadOlderRuns();
    });

    document.getElementById("toggle-btn").addEventListener("click", async () => {
        if (!agent) return;
        const btn = document.getElementById("toggle-btn");
        btn.disabled = true;
        try {
            await api("/admin/api/agents/" + agent.id + "/toggle", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
            });
            await loadAgent();
            await loadRuns();
        } catch (err) {
            alert(err.message);
            btn.disabled = false;
        }
    });

    document.getElementById("force-run-btn").addEventListener("click", async () => {
        if (!agent) return;
        const btn = document.getElementById("force-run-btn");
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Running…';
        try {
            await api("/admin/api/agents/" + agent.id + "/force-run", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
            });
            await loadAgent();
            await loadRuns();
        } catch (err) {
            alert(err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-lightning"></i> Force Run';
        }
    });

    document.getElementById("turns-close").addEventListener("click", () => {
        document.getElementById("turns-panel").style.display = "none";
    });

    // Cadence preset buttons
    document.querySelectorAll("#edit-cadence-presets button").forEach((btn) => {
        btn.addEventListener("click", () => {
            const minVal = btn.getAttribute("data-min");
            const maxVal = btn.getAttribute("data-max");
            if (minVal != null) document.getElementById("edit-min-delay").value = minVal;
            if (maxVal != null) document.getElementById("edit-max-delay").value = maxVal;
        });
    });

    // Reset status / re-arm button
    document.getElementById("reset-status-btn").addEventListener("click", async () => {
        if (!agent) return;
        const btn = document.getElementById("reset-status-btn");
        const feedback = document.getElementById("edit-feedback");
        btn.disabled = true;
        feedback.textContent = "Resetting status…";
        feedback.className = "small text-muted ms-2";
        try {
            await api("/admin/api/agents/" + agent.id, {
                method: "PUT",
                body: JSON.stringify({ reset_status: true }),
            });
            feedback.textContent = "Status reset and agent re-armed.";
            feedback.className = "small text-success ms-2";
            await loadAgent();
            await loadRuns();
        } catch (err) {
            feedback.textContent = "Reset failed: " + err.message;
            feedback.className = "small text-danger ms-2";
        } finally {
            btn.disabled = false;
        }
    });

    // Providers and Models
    let providersList = [];

    async function loadProviders() {
        try {
            const data = await api("/admin/api/providers");
            providersList = data.providers || [];
            const select = document.getElementById("edit-provider-select");
            select.innerHTML = "";
            if (!providersList.length) {
                select.appendChild(el("option", "", "No providers configured"));
                return;
            }

            providersList.forEach((p) => {
                const opt = el("option", "", p.name + (p.is_default ? " (Default)" : ""));
                opt.value = p.id;
                select.appendChild(opt);
            });

            syncProviderSelection();
        } catch (err) {
            console.error("Failed to load providers:", err);
        }
    }

    function syncProviderSelection() {
        if (!agent || !providersList.length) return;
        const select = document.getElementById("edit-provider-select");
        const cfg = agent.config || {};
        let matched = null;

        if (cfg.provider_id) {
            matched = providersList.find(p => p.id === Number(cfg.provider_id));
        }
        if (!matched && cfg.api_url) {
            matched = providersList.find(p => p.api_url === cfg.api_url || p.api_url === String(cfg.api_url).replace(/\/$/, ""));
        }
        if (!matched) {
            matched = providersList.find(p => p.is_default) || providersList[0];
        }

        if (matched) {
            select.value = matched.id;
            updateEditModelOptions(matched, false);
        }
    }

    function updateEditModelOptions(provider, setDefaultModel = true) {
        const datalist = document.getElementById("edit-model-options");
        const modelInput = document.getElementById("edit-model");
        datalist.innerHTML = "";
        if (!provider) return;

        (provider.models || []).forEach((m) => {
            const opt = document.createElement("option");
            opt.value = m;
            datalist.appendChild(opt);
        });

        if (setDefaultModel) {
            if (provider.default_model) {
                modelInput.value = provider.default_model;
            } else if (provider.models && provider.models.length > 0) {
                modelInput.value = provider.models[0];
            }
        }
    }

    document.getElementById("edit-provider-select").addEventListener("change", function () {
        const selectedId = Number(this.value);
        const provider = providersList.find(p => p.id === selectedId);
        if (provider) {
            updateEditModelOptions(provider, true);
        }
    });

    document.getElementById("edit-refresh-models-btn").addEventListener("click", async function () {
        const providerId = document.getElementById("edit-provider-select").value;
        if (!providerId) return;
        const icon = this.querySelector("i");
        const origClass = icon ? icon.className : "";
        if (icon) icon.className = "spinner-border spinner-border-sm";
        this.disabled = true;
        try {
            const data = await api(`/admin/api/providers/${providerId}/refresh-models`, { method: "POST" });
            if (data.models) {
                const provider = providersList.find(p => p.id === Number(providerId));
                if (provider) {
                    provider.models = data.models;
                    if (data.default_model) provider.default_model = data.default_model;
                    updateEditModelOptions(provider, false);
                }
            }
        } catch (err) {
            alert("Failed to refresh models: " + err.message);
        } finally {
            if (icon) icon.className = origClass;
            this.disabled = false;
        }
    });

    // Image providers (separate namespace from LLM providers; agent.config.image_posts)
    let imageProvidersList = [];

    async function loadImageProviders() {
        try {
            const data = await api("/admin/api/image-providers");
            imageProvidersList = data.providers || [];
            const select = document.getElementById("edit-image-provider-select");
            select.innerHTML = "";
            select.appendChild(el("option", "", "(none)")).value = "";
            imageProvidersList.forEach((p) => {
                let label = p.name;
                if (!p.is_enabled) label += " (disabled)";
                else if (!p.credential_set) label += " (no credential)";
                const opt = el("option", "", label);
                opt.value = p.id;
                select.appendChild(opt);
            });
            syncImageProviderSelection();
        } catch (err) {
            console.error("Failed to load image providers:", err);
        }
    }

    function syncImageProviderSelection() {
        if (!agent) return;
        const select = document.getElementById("edit-image-provider-select");
        if (!select.options.length) return;
        const imgCfg = (agent.config && agent.config.image_posts) || {};
        const select_id = imgCfg.provider_id != null ? String(imgCfg.provider_id) : "";
        select.value = select_id;
        const provider = imageProvidersList.find(p => p.id === Number(select_id));
        updateImageModelHint(provider || null);
    }

    function updateImageModelHint(provider) {
        const hint = document.getElementById("edit-image-model-hint");
        if (!hint) return;
        hint.textContent = provider && provider.default_model
            ? "Falls back to provider default: " + provider.default_model
            : (provider ? "No provider default model set; an override is required." : "");
    }

    async function refreshEditImageModelSuggestions(providerId) {
        const datalist = document.getElementById("edit-image-model-options");
        datalist.innerHTML = "";
        if (!providerId) return;
        try {
            const data = await api(`/admin/api/image-providers/${providerId}/models`);
            (data.options || []).forEach((opt) => {
                const node = document.createElement("option");
                node.value = opt.model_id;
                datalist.appendChild(node);
            });
        } catch (err) {
            console.error("Failed to refresh image model suggestions:", err);
        }
    }

    document.getElementById("edit-image-provider-select").addEventListener("change", function () {
        // Refresh suggestions and the default-model hint only - never
        // silently overwrite whatever the admin already typed as an override.
        const provider = imageProvidersList.find(p => p.id === Number(this.value));
        updateImageModelHint(provider || null);
        refreshEditImageModelSuggestions(this.value);
    });

    // Edit form submission
    document.getElementById("edit-agent-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!agent) return;
        const saveBtn = document.getElementById("save-agent-btn");
        const feedback = document.getElementById("edit-feedback");
        saveBtn.disabled = true;
        feedback.textContent = "Saving changes…";
        feedback.className = "small text-muted ms-2";

        const minDelay = document.getElementById("edit-min-delay").value;
        const maxDelay = document.getElementById("edit-max-delay").value;
        const maxActions = document.getElementById("edit-max-actions").value;
        const maxSeconds = document.getElementById("edit-max-seconds").value;
        const ceilingVal = document.getElementById("edit-ceiling").value.trim();
        const providerId = document.getElementById("edit-provider-select").value;
        const provider = providersList.find(p => p.id === Number(providerId));

        const payload = {
            autonomy_tier: document.getElementById("edit-tier-select").value,
            is_enabled: document.getElementById("edit-enabled-switch").checked,
            provider_id: providerId ? Number(providerId) : null,
            api_url: provider ? provider.api_url : "",
            model: document.getElementById("edit-model").value.trim(),
            min_delay: minDelay !== "" ? Number(minDelay) : 60,
            max_delay: maxDelay !== "" ? Number(maxDelay) : 900,
            max_actions_per_run: maxActions !== "" ? Number(maxActions) : 30,
            max_run_seconds: maxSeconds !== "" ? Number(maxSeconds) : 300,
            daily_request_ceiling: ceilingVal !== "" ? Number(ceilingVal) : null,
        };

        const imageEnabled = document.getElementById("edit-image-enabled-switch").checked;
        const imagePosts = { enabled: imageEnabled };
        if (imageEnabled) {
            const imgProviderId = document.getElementById("edit-image-provider-select").value;
            if (imgProviderId) imagePosts.provider_id = Number(imgProviderId);
            const imgModel = document.getElementById("edit-image-model").value.trim();
            if (imgModel) imagePosts.model = imgModel;
            imagePosts.policy = document.getElementById("edit-image-policy-select").value;
        }
        payload.image_posts = imagePosts;

        try {
            const data = await api("/admin/api/agents/" + agent.id, {
                method: "PUT",
                body: JSON.stringify(payload),
            });
            feedback.textContent = "Changes saved successfully.";
            feedback.className = "small text-success ms-2";
            await loadAgent();
        } catch (err) {
            feedback.textContent = err.message;
            feedback.className = "small text-danger ms-2";
        } finally {
            saveBtn.disabled = false;
        }
    });

    Promise.all([loadProviders(), loadImageProviders()])
        .then(loadAgent)
        .then(loadRuns)
        .catch((err) => console.error(err));
})();
</script>
{% endblock %}
