{% extends "admin/base.html" %}

{% block title %}Agents{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Agents</h1>
    <div class="btn-toolbar">
        <button id="start-all-btn" class="btn btn-sm btn-outline-success me-2">
            <i class="bi bi-play-fill"></i> Start All
        </button>
        <button id="pause-all-btn" class="btn btn-sm btn-outline-warning">
            <i class="bi bi-pause-fill"></i> Pause All
        </button>
    </div>
</div>

<!-- Create Agent -->
<div class="card mb-4">
    <div class="card-header"><h5 class="mb-0">Create Agent</h5></div>
    <div class="card-body">
        <form id="create-form" class="row g-3">
            <div class="col-md-4">
                <label for="persona-select" class="form-label">Persona</label>
                <select id="persona-select" class="form-select" required>
                    <option value="">Loading personas…</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="tier-select" class="form-label">Autonomy tier</label>
                <select id="tier-select" class="form-select">
                    <option value="lurker">lurker</option>
                    <option value="regular" selected>regular</option>
                    <option value="power_user">power_user</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="api-url-input" class="form-label">API URL</label>
                <input type="text" id="api-url-input" class="form-control" placeholder="(server default)">
            </div>
            <div class="col-md-3">
                <label for="model-input" class="form-label">Model</label>
                <input type="text" id="model-input" class="form-control" placeholder="(server default)">
            </div>

            <div class="col-md-6">
                <label class="form-label d-block">Cadence (delay seconds)</label>
                <div id="cadence-presets" class="btn-group btn-group-sm mb-2" role="group"></div>
                <div class="d-flex gap-2">
                    <input type="number" id="min-delay-input" class="form-control form-control-sm" min="0" placeholder="min delay">
                    <input type="number" id="max-delay-input" class="form-control form-control-sm" min="0" placeholder="max delay">
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label d-block">Daily request ceiling</label>
                <div id="ceiling-presets" class="btn-group btn-group-sm mb-2" role="group"></div>
                <input type="number" id="ceiling-input" class="form-control form-control-sm" min="1" placeholder="(unlimited)">
            </div>

            <div class="col-12">
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="backfill-check" checked>
                    <label class="form-check-label" for="backfill-check">Backfill memory from persona history</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="enable-check">
                    <label class="form-check-label" for="enable-check">Enable immediately (otherwise created disabled)</label>
                </div>
            </div>

            <div class="col-12">
                <button type="submit" id="create-submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-lg"></i> Create Agent
                </button>
                <span id="create-feedback" class="ms-2 small"></span>
            </div>
        </form>
    </div>
</div>

<!-- Registered Agents -->
<div class="card">
    <div class="card-header"><h5 class="mb-0">Registered Agents</h5></div>
    <div class="card-body table-responsive">
        <table class="table table-sm align-middle">
            <thead>
                <tr>
                    <th>Persona</th>
                    <th>Tier</th>
                    <th>Status</th>
                    <th>Enabled</th>
                    <th>Last Run</th>
                    <th>Next Run</th>
                    <th>Fails</th>
                    <th>Runs (ok/bad/int)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="agents-tbody">
                <tr><td colspan="9" class="text-muted text-center">Loading…</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
    "use strict";

    const STATUS_BADGE = {
        idle: "bg-success",
        running: "bg-primary",
        failed: "bg-danger",
        interrupted: "bg-secondary",
    };

    function esc(value) {
        return String(value == null ? "" : value);
    }

    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = esc(text);
        return node;
    }

    function fmtDate(iso) {
        return iso ? iso.replace("T", " ").slice(0, 19) : "-";
    }

    async function api(path, options) {
        const response = await fetch(path, Object.assign({headers: {"Content-Type": "application/json"}}, options || {}));
        let data = {};
        try { data = await response.json(); } catch (err) { /* non-JSON body */ }
        if (!response.ok) {
            throw new Error(data.error || data.message || ("HTTP " + response.status));
        }
        return data;
    }

    async function loadPresets() {
        try {
            const presets = await api("{{ url_for('admin.api_agent_presets') }}");
            const cadenceWrap = document.getElementById("cadence-presets");
            cadenceWrap.innerHTML = "";
            Object.entries(presets.cadence).forEach(([name, pair]) => {
                const btn = el("button", "btn btn-outline-secondary", name + " (" + pair[0] + "/" + pair[1] + ")");
                btn.type = "button";
                btn.addEventListener("click", () => {
                    document.getElementById("min-delay-input").value = pair[0];
                    document.getElementById("max-delay-input").value = pair[1];
                });
                cadenceWrap.appendChild(btn);
            });
            const ceilingWrap = document.getElementById("ceiling-presets");
            ceilingWrap.innerHTML = "";
            Object.entries(presets.daily_request_ceiling).forEach(([name, value]) => {
                const btn = el("button", "btn btn-outline-secondary", name + " (" + value + ")");
                btn.type = "button";
                btn.addEventListener("click", () => {
                    document.getElementById("ceiling-input").value = value;
                });
                ceilingWrap.appendChild(btn);
            });
        } catch (err) {
            console.error("Failed to load presets:", err);
        }
    }

    async function loadCandidates() {
        const select = document.getElementById("persona-select");
        try {
            const data = await api("{{ url_for('admin.api_persona_candidates') }}");
            select.innerHTML = "";
            if (!data.candidates.length) {
                select.appendChild(el("option", "", "No candidate personas"));
                return;
            }
            select.appendChild(el("option", "", "Choose a persona…")).value = "";
            data.candidates.forEach((candidate) => {
                const label = candidate.username +
                    " — posts " + candidate.post_count +
                    ", comments " + candidate.comment_count +
                    (candidate.personality_preview ? " — " + candidate.personality_preview : "");
                select.appendChild(el("option", "", label)).value = candidate.username;
            });
        } catch (err) {
            select.innerHTML = "";
            select.appendChild(el("option", "", "Failed to load candidates"));
            console.error(err);
        }
    }

    function actionsCell(agent) {
        const cell = el("td");
        const toggleBtn = el("button", "btn btn-sm " + (agent.is_enabled ? "btn-outline-warning" : "btn-outline-success"),
            agent.is_enabled ? "Disable" : "Enable");
        toggleBtn.addEventListener("click", async () => {
            toggleBtn.disabled = true;
            try {
                await api("/admin/api/agents/" + agent.id + "/toggle", {method: "POST"});
                await loadAgents();
                await loadCandidates();
            } catch (err) { alert(err.message); toggleBtn.disabled = false; }
        });
        const runBtn = el("button", "btn btn-sm btn-outline-primary ms-1", "Force Run");
        if (agent.status === "running") runBtn.disabled = true;
        runBtn.title = "Runs one visit synchronously (may take a few minutes)";
        runBtn.addEventListener("click", () => runForceRun(agent.id, runBtn));
        const viewLink = el("a", "btn btn-sm btn-outline-secondary ms-1", "View");
        viewLink.href = {{ url_for('admin.agent_detail', username='__U__') | tojson }}.replace("__U__", encodeURIComponent(agent.user_username));
        cell.appendChild(toggleBtn);
        cell.appendChild(runBtn);
        cell.appendChild(viewLink);
        return cell;
    }

    async function runForceRun(agentId, btn) {
        btn.disabled = true;
        btn.textContent = "Running…";
        try {
            await api("/admin/api/agents/" + agentId + "/force-run", {method: "POST"});
            await loadAgents();
        } catch (err) {
            alert(err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = "Force Run";
        }
    }

    async function loadAgents() {
        const tbody = document.getElementById("agents-tbody");
        try {
            const data = await api("{{ url_for('admin.api_agents_list') }}");
            tbody.innerHTML = "";
            if (!data.agents.length) {
                const row = el("tr");
                row.appendChild(el("td", "text-muted text-center", "No agents registered yet."));
                row.firstChild.colSpan = 9;
                tbody.appendChild(row);
                return;
            }
            data.agents.forEach((agent) => {
                const row = el("tr");
                const personaCell = el("td");
                const link = document.createElement("a");
                link.href = {{ url_for('admin.agent_detail', username='__U__') | tojson }}.replace("__U__", encodeURIComponent(agent.user_username));
                link.textContent = agent.user_username;
                personaCell.appendChild(link);
                row.appendChild(personaCell);
                row.appendChild(el("td", null, agent.autonomy_tier));
                const status = el("td");
                status.appendChild(el("span", "badge " + (STATUS_BADGE[agent.status] || "bg-dark"), agent.status));
                row.appendChild(status);
                const enabled = el("td");
                enabled.appendChild(el("span", "badge " + (agent.is_enabled ? "bg-success" : "bg-secondary"), agent.is_enabled ? "enabled" : "disabled"));
                row.appendChild(enabled);
                row.appendChild(el("td", null, fmtDate(agent.last_run_at)));
                row.appendChild(el("td", null, fmtDate(agent.next_run_at)));
                row.appendChild(el("td", null, agent.consecutive_failures));
                row.appendChild(el("td", null,
                    agent.runs_completed + "/" + agent.runs_failed + "/" + agent.runs_interrupted +
                    " (" + agent.runs_total + ")"));
                row.appendChild(actionsCell(agent));
                tbody.appendChild(row);
            });
        } catch (err) {
            tbody.innerHTML = "";
            const row = el("tr");
            row.appendChild(el("td", "text-danger text-center", "Failed to load agents: " + err.message));
            row.firstChild.colSpan = 9;
            tbody.appendChild(row);
        }
    }

    document.getElementById("create-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const feedback = document.getElementById("create-feedback");
        const submit = document.getElementById("create-submit");
        const username = document.getElementById("persona-select").value;
        feedback.textContent = "";
        feedback.className = "ms-2 small";
        if (!username) {
            feedback.textContent = "Pick a persona first.";
            feedback.classList.add("text-danger");
            return;
        }
        submit.disabled = true;
        feedback.textContent = "Creating… (backfill may take a while)";
        const payload = {
            username: username,
            autonomy_tier: document.getElementById("tier-select").value,
            enable: document.getElementById("enable-check").checked,
            backfill_memory: document.getElementById("backfill-check").checked,
        };
        const apiUrl = document.getElementById("api-url-input").value.trim();
        const model = document.getElementById("model-input").value.trim();
        if (apiUrl) payload.api_url = apiUrl;
        if (model) payload.model = model;
        const minDelay = document.getElementById("min-delay-input").value;
        const maxDelay = document.getElementById("max-delay-input").value;
        const ceiling = document.getElementById("ceiling-input").value;
        if (minDelay !== "") payload.min_delay = Number(minDelay);
        if (maxDelay !== "") payload.max_delay = Number(maxDelay);
        if (ceiling !== "") payload.daily_request_ceiling = Number(ceiling);
        try {
            const data = await api("{{ url_for('admin.api_create_agent') }}", {method: "POST", body: JSON.stringify(payload)});
            let message = "Created agent for '" + data.agent.user_username + "'";
            if (payload.backfill_memory && !data.warning) message += ", backfilled " + data.episodes + " episodes";
            if (data.warning) message += " (warning: " + data.warning + ")";
            feedback.textContent = message;
            feedback.classList.add(data.warning ? "text-warning" : "text-success");
            await loadAgents();
            await loadCandidates();
        } catch (err) {
            feedback.textContent = err.message;
            feedback.classList.add("text-danger");
        } finally {
            submit.disabled = false;
        }
    });

    document.getElementById("start-all-btn").addEventListener("click", async (event) => {
        event.target.disabled = true;
        try {
            const data = await api("{{ url_for('admin.api_agents_start_all') }}", {method: "POST"});
            alert("Started " + data.started + " agent(s)");
            await loadAgents();
        } catch (err) { alert(err.message); }
        event.target.disabled = false;
    });

    document.getElementById("pause-all-btn").addEventListener("click", async (event) => {
        event.target.disabled = true;
        try {
            const data = await api("{{ url_for('admin.api_agents_pause_all') }}", {method: "POST"});
            alert("Paused " + data.paused + " agent(s)");
            await loadAgents();
        } catch (err) { alert(err.message); }
        event.target.disabled = false;
    });

    loadPresets();
    loadCandidates();
    loadAgents();
})();
</script>
{% endblock %}
