services:
  web:
    build: .
    ports:
      - "${DEADDIT_WEB_PORT:-5000}:5000"
    # Loads .env (see .env.example) into the container; explicit passthrough
    # below forwards host-set variables too, so API_TOKEN actually reaches the app.
    env_file:
      - path: .env
        required: false
    environment:
      - API_TOKEN
      - SECRET_KEY
      - OPENAI_KEY
      - DEADDIT_LOG_LEVEL
    command:
      - sh
      - -c
      - |
        python - <<'PY'
        from deaddit.wsgi import app
        from deaddit import init_db
        with app.app_context():
            init_db()
        PY
        exec gunicorn -c gunicorn.conf.py deaddit.wsgi:app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(1) if urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).status >= 500 else None",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - deaddit_data:/app/instance
  worker:
    build: .
    depends_on:
      web:
        condition: service_healthy
    # Loads .env (see .env.example) into the container; explicit passthrough
    # below forwards host-set variables too, so API_TOKEN actually reaches the app.
    env_file:
      - path: .env
        required: false
    environment:
      - API_TOKEN
      - SECRET_KEY
      - OPENAI_KEY
      - DEADDIT_LOG_LEVEL
    command: ["deaddit-worker"]
    volumes:
      - deaddit_data:/app/instance
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, time; age = time.time() - os.path.getmtime('/app/instance/worker-heartbeat'); sys.exit(0 if age < 120 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  deaddit_data:
